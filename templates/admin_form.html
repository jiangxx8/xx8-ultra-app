{% extends 'admin_base.html' %}{% block content %}<div class="panel"><div class="panel-head"><div><h2>{% if mode=='add' %}＋ Thêm Telegram ID{% else %}✏️ Sửa Telegram ID{% endif %}</h2><p class="sub">Bộ phận ở đây sẽ quyết định ca được hiển thị trong Mini App.</p></div><a class="btn" href="{{url_for('admin_index')}}">← Quay lại</a></div><form method="post" class="form grid"><div><label>Tên nhân viên</label><input name="name" required value="{{user.name if user else ''}}"></div><div><label>Telegram ID</label><input name="telegram_id" required inputmode="numeric" value="{{user.telegram_id if user else ''}}"></div><div><label>Loại ID</label><select name="id_type">{% for x in id_types %}<option value="{{x}}" {% if user and user.id_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div><label>Bộ phận</label><select name="department">{% for x in departments %}<option value="{{x}}" {% if user and user.department==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div class="full"><label>Ghi chú</label><input name="note" value="{{user.note if user else ''}}"></div><div class="full"><label class="check"><input type="checkbox" name="enabled" value="1" {% if not user or user.enabled %}checked{% endif %}> Cho phép sử dụng Mini App</label></div><div class="full"><button class="btn primary" type="submit">💾 LƯU</button></div></form></div>{% endblock %}

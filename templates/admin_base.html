<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Quản lý Telegram ID{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"></head><body><header class="topbar"><div><h1>QUẢN LÝ TELEGRAM ID</h1><p>Quyền Mini App · XNK / FK / CSKH</p></div>{% if session.get('admin_logged_in') %}<a class="btn ghost light" href="{{ url_for('admin_logout') }}">Đăng xuất</a>{% endif %}</header><main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>

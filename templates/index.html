<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>XX8 ULTRA</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --pink:#fc5a5f;
      --pink2:#e84d59;
      --wine:#6b2430;
      --soft:#fff5f2;
      --line:#f1d8d8;
      --text:#20242a;
    }
    body {
      margin:0;
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(180deg,#fff2f3 0%,#fff 55%);
      color:var(--text);
      padding:18px 14px max(18px, env(safe-area-inset-bottom));
    }
    .wrap { max-width:430px; margin:0 auto; }
    .head {
      text-align:center;
      padding:12px 8px 18px;
    }
    .logo {
      width:68px;height:68px;border-radius:22px;
      margin:0 auto 10px;
      display:flex;align-items:center;justify-content:center;
      background:var(--pink);
      color:white;font-size:27px;font-weight:900;
      box-shadow:0 10px 25px rgba(252,90,95,.25);
    }
    h1 { margin:0; font-size:24px; color:var(--wine); }
    .sub { margin:7px 0 0; color:#7a6669; font-size:14px; }
    .card {
      background:#fff;
      border:1px solid var(--line);
      border-radius:22px;
      padding:18px;
      box-shadow:0 12px 36px rgba(80,30,40,.08);
    }
    .user {
      display:flex;align-items:center;gap:12px;
      background:var(--soft);
      border-radius:16px;
      padding:12px 13px;
      margin-bottom:17px;
    }
    .avatar {
      width:42px;height:42px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:#fff;color:var(--pink);font-weight:800;
      border:1px solid var(--line);
    }
    .user b { display:block; font-size:15px; }
    .user small { color:#8b7478; }
    label { display:block; font-weight:800; color:var(--wine); margin:5px 0 8px; }
    input {
      width:100%;
      height:54px;
      border:1.5px solid #ded5d6;
      border-radius:14px;
      padding:0 15px;
      font-size:17px;
      outline:none;
      background:#fff;
    }
    input:focus { border-color:var(--pink); box-shadow:0 0 0 3px rgba(252,90,95,.12); }
    button {
      width:100%;
      height:54px;
      margin-top:15px;
      border:0;border-radius:14px;
      background:linear-gradient(180deg,var(--pink),var(--pink2));
      color:#fff;font-size:16px;font-weight:900;
      cursor:pointer;
    }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .note {
      text-align:center;
      font-size:12px;
      color:#927d80;
      margin-top:12px;
      line-height:1.45;
    }
    .status {
      display:none;
      margin-top:14px;
      padding:12px 13px;
      border-radius:13px;
      font-size:14px;
      line-height:1.4;
      text-align:center;
    }
    .ok { display:block;background:#ecfbf1;color:#176637;border:1px solid #ccefd8; }
    .err { display:block;background:#fff0f0;color:#9a2630;border:1px solid #f2cccc; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="logo">XX8</div>
      <h1>GỬI THÔNG TIN ULTRA</h1>
      <p class="sub">Nhập ULTRA ID và gửi trực tiếp đến nhóm quản lý</p>
    </div>

    <div class="card">
      <div class="user">
        <div class="avatar" id="avatar">👤</div>
        <div>
          <b id="name">Đang nhận diện Telegram...</b>
          <small id="tid"></small>
        </div>
      </div>

      <label for="ultra">💻 ULTRA ID</label>
      <input id="ultra" type="text" autocomplete="off" maxlength="100"
             placeholder="Nhập ULTRA ID" inputmode="text">

      <button id="submitBtn" type="button">XÁC NHẬN GỬI</button>
      <div id="status" class="status"></div>

      <div class="note">
        Chỉ tài khoản Telegram đã được quản lý cấp quyền mới gửi được.
      </div>
    </div>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  const btn = document.getElementById("submitBtn");
  const input = document.getElementById("ultra");
  const statusBox = document.getElementById("status");

  function showStatus(message, ok) {
    statusBox.textContent = message;
    statusBox.className = "status " + (ok ? "ok" : "err");
  }

  if (tg) {
    tg.ready();
    tg.expand();
    try {
      tg.setHeaderColor("#fc5a5f");
      tg.setBackgroundColor("#fff5f2");
    } catch (_) {}

    const user = tg.initDataUnsafe?.user;
    if (user) {
      const fullName = [user.first_name, user.last_name].filter(Boolean).join(" ");
      document.getElementById("name").textContent = fullName || "Nhân viên Telegram";
      document.getElementById("tid").textContent = "Telegram ID: " + user.id;
      document.getElementById("avatar").textContent =
        (user.first_name || "T").charAt(0).toUpperCase();
    }
  } else {
    document.getElementById("name").textContent = "Hãy mở trang này từ bot Telegram";
  }

  btn.addEventListener("click", async () => {
    const ultra = input.value.trim();

    if (!ultra) {
      showStatus("Vui lòng nhập ULTRA ID.", false);
      input.focus();
      return;
    }

    if (!tg || !tg.initData) {
      showStatus("Trang này phải được mở từ nút Ứng dụng trong bot Telegram.", false);
      return;
    }

    btn.disabled = true;
    btn.textContent = "ĐANG GỬI...";
    statusBox.className = "status";

    try {
      const res = await fetch("/submit", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          initData: tg.initData,
          ultra_id: ultra
        })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok || !data.ok) {
        throw new Error(data.message || "Gửi thất bại.");
      }

      showStatus("✅ " + data.message, true);
      try { tg.HapticFeedback.notificationOccurred("success"); } catch (_) {}
      input.value = "";

      setTimeout(() => {
        try { tg.close(); } catch (_) {}
      }, 1200);

    } catch (err) {
      showStatus(err.message || "Có lỗi xảy ra.", false);
      try { tg.HapticFeedback.notificationOccurred("error"); } catch (_) {}
    } finally {
      btn.disabled = false;
      btn.textContent = "XÁC NHẬN GỬI";
    }
  });
</script>
</body>
</html>
